###############################################################################
# compose.override.yaml — Overrides para desenvolvimento local
#
# Ativado automaticamente pelo Docker Compose quando presente.
# Em produção, o deploy deve usar: docker compose -f compose.yaml up
###############################################################################
services:
  app:
    build:
      context: .
      dockerfile: docker/dev/Dockerfile
      args:
        - USER_ID=${UID:-1000}
        - GROUP_ID=${GID:-1000}
    entrypoint: [ "/usr/local/bin/entrypoint.dev.sh" ]
    command: [ "php", "artisan", "octane:start", "--server=frankenphp", "--host=0.0.0.0", "--port=8000", "--watch" ]
    ports:
      - '8000:8000'
      - '5173:5173'
    depends_on:
      pgsql:
        condition: service_healthy
    environment:
      # Informa ao laravel-vite-plugin onde o Vite dev server está rodando
      VITE_DEV_SERVER_URL: 'http://localhost:5173'
    volumes:
      - .:/var/www/html
      - ~/.composer:/home/www-data/.composer
    networks:
      - lunchbox
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/up" ]
      interval: 5s
      retries: 3
      timeout: 5s

  pgsql:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USERNAME:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_DATABASE:-mydb}
    volumes:
      - db:/var/lib/postgresql/data
    networks:
      - lunchbox
    ports:
      - "${FORWARD_DB_PORT:-5438}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-root} -d ${DB_DATABASE:-mydb}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  db:
    driver: local

networks:
  lunchbox:
    driver: bridge
